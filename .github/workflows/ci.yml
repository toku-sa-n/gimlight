name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14.x
          dune-cache: true

      - name: Install dependencies
        run: opam install . --deps-only

      - name: Build
        run: dune build

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14.x
          dune-cache: true

      - name: Install dependencies
        run: opam install . --deps-only

      - name: Run tests
        run: dune runtest

  prettier-format:
    name: Prettier Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check YAML, Markdown, and JSON files
        run: npx --yes prettier@3.9.5 --check $(git ls-files -- '*.json' '*.md' '*.yaml' '*.yml')

  binary-files:
    name: Binary Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check binary files
        shell: bash
        run: |
          failed=0

          while IFS= read -r -d '' file; do
            if [[ -s "$file" ]] && ! LC_ALL=C grep -Iq . "$file"; then
              echo "::error file=$file::binary files are not allowed"
              failed=1
            fi
          done < <(git ls-files -z)

          exit "$failed"

  final-newline:
    name: Final Newline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check final newline
        shell: bash
        run: |
          failed=0

          while IFS= read -r -d '' file; do
            if [[ -s "$file" ]] && [[ $(tail -c 1 "$file" | wc -l) -eq 0 ]]; then
              echo "::error file=$file::file must end with a newline"
              failed=1
            fi
          done < <(git ls-files -z)

          exit "$failed"

  crlf-line-endings:
    name: CRLF Line Endings
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check CRLF line endings
        shell: bash
        run: |
          failed=0

          while IFS= read -r -d '' file; do
            if LC_ALL=C grep -q $'\r' "$file"; then
              echo "::error file=$file::CRLF line endings are not allowed"
              failed=1
            fi
          done < <(git ls-files -z)

          exit "$failed"
